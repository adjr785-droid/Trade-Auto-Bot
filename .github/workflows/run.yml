name: BitgetBot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevents overlapping runs which cause Git conflicts
concurrency:
  group: bitget-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests ccxt

      - env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bitget_bot.py
